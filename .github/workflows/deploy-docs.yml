name: 部署文档

on:
  push:
    branches:
      # 确保这是你正在使用的分支名称
      - main

jobs:
  check-deploy-toggle:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: 检查部署开关状态
        id: check
        run: |
          if [ -f .vercel-deploy ]; then
            STATE=$(cat .vercel-deploy | tr -d '[:space:]')
            if [ "$STATE" = "disabled" ]; then
              echo "should_run=false" >> $GITHUB_OUTPUT
              echo "🔴 部署开关已关闭，跳过本次部署"
            else
              echo "should_run=true" >> $GITHUB_OUTPUT
              echo "🟢 部署开关已开启，继续部署"
            fi
          else
            echo "should_run=true" >> $GITHUB_OUTPUT
          fi

  deploy-gh-pages:
    needs: check-deploy-toggle
    if: needs.check-deploy-toggle.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ACCESS_TOKEN }}
          fetch-depth: 0
          # 如果你文档需要 Git 子模块，取消注释下一行
          submodules: true

      - name: Install pnpm
        uses: pnpm/action-setup@v4
          
      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建文档
        env:
          NODE_OPTIONS: --max_old_space_size=8192
        run: |-
          pnpm build
          > src/.vuepress/dist/.nojekyll

      - name: 部署文档
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          # 这是文档部署到的分支名称
          # branch: gh-pages
          branch: blog_plus_pages
          folder: src/.vuepress/dist
          token: ${{ secrets.ACCESS_TOKEN }}
