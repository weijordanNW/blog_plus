name: docker images cicd
# 触发器设置
on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "src/**/*.md"
      - "src/feishu/**"
      - "src/yuque/**"
      - "feishu/**"
      - "yuque/**"
      - "elog*.cache.json"
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - "src/**/*.md"
      - "src/feishu/**"
      - "src/yuque/**"
      - "feishu/**"
      - "yuque/**"
      - "elog*.cache.json"

# 项目任务，任务之间可以并行调度
jobs:
  check-deploy-toggle:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: 检查部署开关状态
        id: check
        run: |
          if [ -f .vercel-deploy ]; then
            STATE=$(cat .vercel-deploy | tr -d '[:space:]')
            if [ "$STATE" = "disabled" ]; then
              echo "should_run=false" >> $GITHUB_OUTPUT
              echo "🔴 部署开关已关闭，跳过本次构建"
            else
              echo "should_run=true" >> $GITHUB_OUTPUT
              echo "🟢 部署开关已开启，继续构建"
            fi
          else
            echo "should_run=true" >> $GITHUB_OUTPUT
          fi

  build:
    needs: check-deploy-toggle
    if: needs.check-deploy-toggle.outputs.should_run == 'true'
  # 选择云端运行的环境
    runs-on: ubuntu-latest
    steps:
    # uses代表使用一个模块，此处使用的是checkout模块，将github项目文件导入到当前环境中
    - uses: actions/checkout@v4
    # 使用with跟在后面来为前面的模块输入参数
      with:
        submodules: 'true'
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
    # 这里用到了github的secrets功能，避免账户和密码随仓库泄露
       username: ${{ secrets.DOCKER_USERNAME }}
       password: ${{ secrets.DOCKER_TOKEN }}
    # 设置当前的发行版本tag
    - name: Release version
      id: release_version
      run: |
        app_version=$(cat version.py |sed -ne "s/APP_VERSION\s=\s'v\(.*\)'/\1/gp")
        echo "app_version=$app_version" >> $GITHUB_ENV
    # 开始构建镜像
    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: .
        file: Dockerfile
        build-args: |
          GITHUB_TOKEN=${{ secrets.RELEASE_TOKEN }}
        platforms: |
          linux/amd64
          linux/arm64
          linux/arm
        push: true
        # 指定用户/仓库名
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/blog_plus:latest
          ${{ secrets.DOCKER_USERNAME }}/blog_plus:${{ env.app_version }}
    # 这里是通过md文件自动生成dockerhub描述的模块，也可以不需要
    - name: Docker Hub Description
      uses: peter-evans/dockerhub-description@v4
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
        repository: ${{ secrets.DOCKER_USERNAME }}/blog_plus
        readme-filepath: ./README.md
